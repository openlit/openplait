name: Publish Package to npmjs

# Mirrors OpenLIT sdk/typescript npm-release.yml (tag-driven + workflow_dispatch).
# Tag pattern: ts-*.*.* (same as OpenLIT). Workspace root: typescript/

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. alpha, latest)'
        required: true
        default: 'alpha'
  push:
    tags: ['ts-*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Validate tag version matches packages/core
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/ts-}"
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "typescript/packages/core version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ts-$TAG_VERSION does not match typescript/packages/core version $PKG_VERSION"
            exit 1
          fi
          echo "✓ Version validation passed"

      - uses: actions/setup-node@v6
        name: Setup .npmrc file to publish to npm
        with:
          node-version: '20.19'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@openplait'
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build packages
        run: npm run build

      - name: Publish packages (dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.event.inputs.tag || 'alpha' }}
        run: |
          set -euo pipefail
          for pkg in \
            @openplait/core \
            @openplait/adapter-sdk \
            @openplait/adapter-clickhouse \
            @openplait/adapter-tempo \
            @openplait/adapter-loki \
            @openplait/adapter-prometheus \
            @openplait/adapter-jaeger \
            @openplait/runtime \
            @openplait/perses
          do
            echo "Publishing $pkg with tag $DIST_TAG"
            npm publish -w "$pkg" --access public --tag "$DIST_TAG" --provenance
          done
