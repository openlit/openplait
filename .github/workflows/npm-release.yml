name: Publish Package to npmjs

# Trusted publishing (OIDC) — no long-lived NPM_TOKEN.
# https://docs.npmjs.com/trusted-publishers
#
# Tag pattern: ts-*.*.*  ·  Workspace root: typescript/
# Configure each @openplait/* package on npmjs.com → Settings → Trusted Publisher:
#   Organization: openlit
#   Repository:   openplait
#   Workflow:     npm-release.yml
#   Allowed:      npm publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. alpha, latest)'
        required: true
        default: 'alpha'
  push:
    tags: ['ts-*.*.*']

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v6

      - name: Validate tag version matches packages/core
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/ts-}"
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "typescript/packages/core version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ts-$TAG_VERSION does not match typescript/packages/core version $PKG_VERSION"
            exit 1
          fi
          echo "✓ Version validation passed"

      - uses: actions/setup-node@v6
        name: Setup Node for trusted publish
        with:
          # Trusted publishing requires Node >= 22.14 and npm >= 11.5.1
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@openplait'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build packages
        run: npm run build

      # OIDC auth — do not set NODE_AUTH_TOKEN (it overrides trusted publishing).
      # Provenance is generated automatically with trusted publishing.
      - name: Publish packages (dependency order)
        env:
          DIST_TAG: ${{ github.event.inputs.tag || 'alpha' }}
        run: |
          set -euo pipefail
          npm --version
          for pkg in \
            @openplait/core \
            @openplait/adapter-sdk \
            @openplait/adapter-clickhouse \
            @openplait/adapter-tempo \
            @openplait/adapter-loki \
            @openplait/adapter-prometheus \
            @openplait/adapter-jaeger \
            @openplait/runtime \
            @openplait/perses
          do
            echo "Publishing $pkg with tag $DIST_TAG"
            npm publish -w "$pkg" --access public --tag "$DIST_TAG"
          done
