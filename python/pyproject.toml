[tool.poetry]
name = "openplait"
version = "1.0.0"
description = "Datasource-independent interoperability layer for analytics and observability (Python port of OpenPlait)."
authors = ["OpenLIT"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/openlit/openplait"
repository = "https://github.com/openlit/openplait"
documentation = "https://github.com/openlit/openplait/tree/main/docs"
keywords = [
  "openplait",
  "openlit",
  "opentelemetry",
  "observability",
  "datasource",
  "adapter",
  "promql",
  "traceql",
  "logql",
]
packages = [{ include = "openplait", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9.0"
pydantic = "^2.0.0"
pyyaml = "^6.0.0"
jsonschema = "^4.22.0"
httpx = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
